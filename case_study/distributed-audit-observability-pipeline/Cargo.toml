[package]
name = "distributed-audit-observability-pipeline"
version = "0.1.0"
edition = "2021"
description = "A generic Rust showcase for audit and observability event processing."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
